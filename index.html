          orange: '#FF9500',

          purple: '#AF52DE',
          teal: '#5AC8FA',

<style>
:root {
  --bg-base:#f2f2f7; --bg-card:rgba(255,255,255,0.9); --bg-elevated:#ffffff;
  --bg-sidebar:rgba(249,249,251,0.97); --bg-code:#f6f8fa;
  --bg-section:rgba(118,118,128,0.1);
  --accent:#007AFF; --accent-light:rgba(0,122,255,0.1);
  --accent-green:#34C759; --accent-red:#FF3B30; --accent-orange:#FF9500;
  --txt-primary:#1c1c1e; --txt-secondary:#3a3a3c; --txt-muted:#8e8e93;
  --txt-placeholder:#c7c7cc;
  --border:rgba(60,60,67,0.12); --border-strong:rgba(60,60,67,0.22);
  --shadow-sm:0 1px 4px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
  --shadow-md:0 4px 20px rgba(0,0,0,0.08),0 2px 6px rgba(0,0,0,0.04);
  --shadow-card:0 2px 14px rgba(0,0,0,0.06);
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px; --r-full:50px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg-base);color:var(--txt-primary);font-family:-apple-system,'SF Pro Display','SF Pro Text','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;letter-spacing:-0.01em;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.15);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,0.25);}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:264px;background:var(--bg-sidebar);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-right:1px solid var(--border);overflow-y:auto;z-index:40;display:flex;flex-direction:column;}
.main-panel{margin-left:264px;min-height:100vh;display:flex;flex-direction:column;background:var(--bg-base);}
.sidebar-item{display:flex;align-items:center;gap:10px;padding:9px 12px;margin:2px 10px;border-radius:var(--r-md);cursor:pointer;transition:all 0.18s ease;border-left:none;position:relative;}
.sidebar-item:hover{background:rgba(0,122,255,0.07);}
.sidebar-item.active{background:var(--accent-light);}
.sidebar-item.active .item-name{color:var(--accent);font-weight:700;}
.sidebar-item.active .pct{color:var(--accent);}
.sidebar-item .icon-bubble{width:32px;height:32px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;box-shadow:var(--shadow-sm);}
.sidebar-item .item-info{flex:1;min-width:0;}
.sidebar-item .item-name{font-size:13px;font-weight:600;color:var(--txt-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sidebar-item .mini-bar{height:3px;background:rgba(0,0,0,0.08);border-radius:2px;margin-top:4px;overflow:hidden;}
.sidebar-item .mini-bar-fill{height:100%;border-radius:2px;background:var(--accent);transition:width 0.5s ease;}
.sidebar-item .pct{font-size:11px;font-weight:700;color:var(--txt-muted);min-width:30px;text-align:right;}
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:16px 24px;background:var(--bg-elevated);border-bottom:1px solid var(--border);}
.stat-card{text-align:center;padding:12px 6px;border-radius:var(--r-md);background:rgba(0,122,255,0.05);border:1px solid var(--border);}
.stat-card .stat-value{font-size:22px;font-weight:800;color:var(--accent);letter-spacing:-0.03em;}
.stat-card .stat-label{font-size:11px;color:var(--txt-muted);margin-top:2px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;}
.top-header{background:rgba(255,255,255,0.92);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--border);padding:20px 26px 16px;position:sticky;top:0;z-index:30;}
.top-header h1{font-size:26px;font-weight:800;color:var(--txt-primary);letter-spacing:-0.03em;}
.top-header .subtitle{font-size:13px;color:var(--txt-muted);margin-top:3px;}
.tab-bar{display:flex;gap:2px;background:rgba(118,118,128,0.12);border-radius:var(--r-md);padding:3px;margin-bottom:20px;width:fit-content;}
.tab-btn{padding:7px 16px;border-radius:9px;font-size:13px;font-weight:600;color:var(--txt-muted);cursor:pointer;border:none;background:transparent;transition:all 0.2s ease;white-space:nowrap;font-family:inherit;}
.tab-btn.active{background:white;color:var(--txt-primary);box-shadow:var(--shadow-sm);}
.tab-btn:hover:not(.active){color:var(--txt-secondary);}
.tab-active{background:white!important;color:var(--txt-primary)!important;box-shadow:var(--shadow-sm);}
.tab-inactive{color:var(--txt-muted);cursor:pointer;}
.tab-inactive:hover{color:var(--txt-secondary);}
.content-area,.content-panel{flex:1;padding:22px 26px 48px;overflow-y:auto;}
.tech-header,.tech-title-row{display:flex;align-items:flex-start;gap:16px;padding:20px;background:var(--bg-elevated);border-radius:var(--r-xl);border:1px solid var(--border);box-shadow:var(--shadow-card);margin-bottom:20px;}
.tech-hero-icon{width:58px;height:58px;border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;box-shadow:var(--shadow-md);}
.tech-header h2,.tech-title-row h2{font-size:22px;font-weight:800;color:var(--txt-primary);letter-spacing:-0.03em;}
.meta-row,.tech-header .meta{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;}
.meta-badge{background:rgba(0,0,0,0.05);border-radius:var(--r-full);padding:3px 10px;font-size:12px;font-weight:500;color:var(--txt-muted);}
.tech-progress-wrap{margin-top:12px;}
.tech-progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--txt-muted);font-weight:500;margin-bottom:5px;}
.tech-progress-track{height:6px;background:rgba(0,0,0,0.08);border-radius:var(--r-full);overflow:hidden;}
.tech-progress-fill{height:100%;border-radius:var(--r-full);background:linear-gradient(90deg,var(--accent),#5AC8FA);transition:width 0.6s cubic-bezier(0.34,1.56,0.64,1);}
.phase-card,.accordion{background:var(--bg-elevated);border-radius:var(--r-lg);margin-bottom:12px;box-shadow:var(--shadow-card);border:1px solid var(--border);overflow:hidden;}
.phase-header,.accordion-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;user-select:none;background:var(--bg-elevated);transition:background 0.15s;font-size:14px;font-weight:700;color:var(--txt-primary);}
.phase-header:hover,.accordion-header:hover{background:rgba(0,122,255,0.04);}
.phase-title{font-size:14px;font-weight:700;color:var(--txt-primary);}
.phase-meta,.phase-hours{font-size:12px;color:var(--txt-muted);font-weight:500;}
.phase-chevron,.acc-arrow{color:var(--txt-muted);transition:transform 0.25s ease;font-size:13px;}
.phase-chevron.open,.acc-arrow.open{transform:rotate(90deg);}
.phase-topics,.accordion-body{max-height:0;overflow:hidden;transition:max-height 0.4s ease;}
.phase-topics.open,.accordion-body.open{max-height:8000px;}
.accordion-content{max-height:0;overflow:hidden;transition:max-height 0.35s ease;}
.accordion-content.open{max-height:8000px;}
.phase-topics-inner,.accordion-body-inner{padding:4px 12px 14px;border-top:1px solid var(--border);}
.topic-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);transition:background 0.15s;cursor:pointer;}
.topic-row:hover{background:rgba(0,0,0,0.03);}
.topic-row.done .topic-text,.topic-row.done label{text-decoration:line-through;color:var(--txt-muted);}
.topic-row input[type="checkbox"]{width:20px;height:20px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;}
.topic-text,.topic-row label{flex:1;font-size:14px;color:var(--txt-secondary);font-weight:500;line-height:1.4;cursor:pointer;}
.hours-badge{background:rgba(0,122,255,0.1);color:var(--accent);border-radius:var(--r-full);padding:2px 9px;font-size:11px;font-weight:600;white-space:nowrap;}
.code-block,.code-block-wrap{position:relative;background:var(--bg-code);border:1px solid var(--border);border-radius:var(--r-lg);margin:12px 0;overflow:hidden;box-shadow:var(--shadow-sm);}
.code-block pre,.code-block-wrap pre{padding:16px 54px 16px 16px;overflow-x:auto;font-family:'SF Mono','Fira Code','JetBrains Mono',Consolas,monospace;font-size:13px;line-height:1.65;color:#1c1c1e;white-space:pre;background:transparent;}
.copy-btn{position:absolute;top:8px;right:8px;background:var(--accent);border:none;color:white;padding:5px 12px;border-radius:var(--r-full);cursor:pointer;font-size:12px;font-weight:600;display:flex;align-items:center;gap:4px;transition:all 0.2s;font-family:inherit;white-space:nowrap;}
.copy-btn:hover{background:#0066DC;transform:scale(1.03);}
.copy-btn:active{transform:scale(0.97);}
.copy-btn.copied{background:var(--accent-green);}
.resource-card{display:flex;align-items:center;gap:12px;padding:13px 16px;background:var(--bg-elevated);border-radius:var(--r-md);margin:6px 0;border:1px solid var(--border);text-decoration:none;transition:all 0.2s;box-shadow:var(--shadow-sm);cursor:pointer;}
.resource-card:hover{transform:translateY(-1px);box-shadow:var(--shadow-md);border-color:rgba(0,122,255,0.3);}
.resource-icon{width:36px;height:36px;background:var(--accent-light);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.resource-name,.r-title{font-size:14px;font-weight:600;color:var(--accent);}
.resource-url,.r-url{font-size:11px;color:var(--txt-muted);margin-top:2px;}
.resource-chevron{color:var(--txt-muted);margin-left:auto;}
.project-card{padding:18px;background:var(--bg-elevated);border-radius:var(--r-lg);margin:8px 0;border:1px solid var(--border);box-shadow:var(--shadow-sm);transition:all 0.2s;}
.project-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
.project-num,.p-num{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:7px;background:var(--accent);color:white;font-size:12px;font-weight:700;margin-bottom:8px;}
.project-name,.p-title{font-size:15px;font-weight:700;color:var(--txt-primary);margin-bottom:6px;letter-spacing:-0.01em;}
.project-desc,.p-desc{font-size:13px;color:var(--txt-muted);line-height:1.55;}
.kb-search,.search-box{width:100%;padding:11px 16px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--bg-elevated);font-size:15px;color:var(--txt-primary);outline:none;font-family:inherit;box-shadow:var(--shadow-sm);transition:all 0.2s;margin-bottom:16px;}
.kb-search:focus,.search-box:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,122,255,0.12);}
.kb-search::placeholder,.search-box::placeholder{color:var(--txt-placeholder);}
.kb-chapter-card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:10px;box-shadow:var(--shadow-sm);overflow:hidden;transition:box-shadow 0.2s;}
.kb-chapter-card:hover{box-shadow:var(--shadow-md);}
.kb-chapter-header{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;cursor:pointer;user-select:none;}
.kb-chapter-title{font-size:14px;font-weight:700;color:var(--txt-primary);}
.kb-badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:var(--r-full);background:var(--accent-light);color:var(--accent);}
.kb-chapter-content{max-height:0;overflow:hidden;transition:max-height 0.35s ease;border-top:1px solid transparent;}
.kb-chapter-content.open{max-height:6000px;border-top-color:var(--border);}
.kb-table{width:100%;border-collapse:collapse;font-size:13px;}
.kb-table th{background:rgba(0,122,255,0.06);padding:9px 14px;text-align:left;font-weight:600;color:var(--accent);font-size:12px;text-transform:uppercase;letter-spacing:0.5px;}
.kb-table td{padding:9px 14px;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.5;color:var(--txt-secondary);}
.kb-table td:first-child{font-weight:600;color:var(--txt-primary);}
.kb-table tr:last-child td{border-bottom:none;}
.kb-note{background:rgba(0,122,255,0.06);border-left:3px solid var(--accent);padding:12px 16px;font-size:13px;color:var(--txt-secondary);line-height:1.55;margin:8px 0;}
.runbook-card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow-sm);}
.runbook-header{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;}
.severity-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.arch-diagram,.lab-card{background:var(--bg-code);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;margin-bottom:14px;box-shadow:var(--shadow-sm);overflow-x:auto;}
.arch-diagram pre{font-family:'SF Mono','Fira Code',monospace;font-size:12px;color:var(--txt-secondary);line-height:1.7;padding:0;}
.lab-num{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;background:var(--accent-green);color:white;font-size:13px;font-weight:700;margin-bottom:8px;}
.lab-title{font-size:15px;font-weight:700;color:var(--txt-primary);margin-bottom:8px;}
.gradient-text{background:linear-gradient(135deg,var(--accent),#5AC8FA);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.gradient-bar{background:linear-gradient(90deg,var(--accent),#5AC8FA);}
.gradient-border{border:1px solid var(--border);background:var(--bg-elevated);}
.section-label{font-size:11px;font-weight:700;color:var(--txt-muted);letter-spacing:0.07em;text-transform:uppercase;padding:14px 18px 5px;display:block;}
.new-badge{background:var(--accent);color:white;font-size:10px;font-weight:700;padding:2px 7px;border-radius:var(--r-full);letter-spacing:0.05em;}
.divider{height:1px;background:var(--border);margin:14px 0;}
canvas{position:fixed;top:0;left:0;pointer-events:none;z-index:9999;}
@keyframes fadeSlideIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.content-area>*,.content-panel>*{animation:fadeSlideIn 0.22s ease both;}
@media(max-width:768px){.sidebar{width:220px;}.main-panel{margin-left:220px;}.stats-bar{grid-template-columns:repeat(2,1fr);}}
</style>
</head>

      { title:'Phase 3 – Performance & Logs', meta:'Week 5-6, 15hrs', topics:[

      { title:'Phase 4 – Bash & Automation', meta:'Week 7, 10hrs', topics:[

      ]},
    ],

function renderSidebar() {
  const nav = document.getElementById('sidebar-nav');
  nav.innerHTML = '';
  const newItems = ['linux','aws','terraform','ansible','gitops','monitoring','platform','windows'];
  const coreItems = ['python','fastapi','kafka','docker','kubernetes','helm','ghactions','gitlab'];

  const newLabel = document.createElement('div');
  newLabel.className = 'sidebar-section-label';
  newLabel.textContent = 'Infrastructure & Cloud';
  nav.appendChild(newLabel);
  SIDEBAR_ITEMS.forEach(item => { if (newItems.includes(item.id)) appendSidebarItem(nav, item); });

  const coreLabel = document.createElement('div');
  coreLabel.className = 'sidebar-section-label';
  coreLabel.textContent = 'Languages & Tools';
  nav.appendChild(coreLabel);
  SIDEBAR_ITEMS.forEach(item => { if (coreItems.includes(item.id)) appendSidebarItem(nav, item); });

  const kbLabel = document.createElement('div');
  kbLabel.className = 'sidebar-section-label';
  kbLabel.textContent = 'Reference';
  nav.appendChild(kbLabel);
  SIDEBAR_ITEMS.forEach(item => { if (item.isKB) appendSidebarItem(nav, item); });

  nav.querySelectorAll('.sidebar-item').forEach(el => {
    el.addEventListener('click', () => {
      activeItem = el.dataset.id;
      if (activeItem !== 'kb') activeTechTab = 'topics';
      render();
      document.getElementById('sidebar').classList.remove('open');
    });
  });
}

  div.className = 'sidebar-item' + (activeItem === item.id ? ' active' : '');
  div.dataset.id = item.id;
  div.innerHTML = `
    <div class="icon-bubble" style="background:${item.color}26;">${item.emoji}</div>
    <div class="item-info">
      <div class="item-name">${item.name}${item.isKB ? ' <span class="new-badge">REF</span>' : ''}</div>
      ${pct !== null ? `<div class="mini-bar"><div class="mini-bar-fill" style="width:${pct}%;background:${item.color};"></div></div>` : ''}
    </div>
    ${pct !== null ? `<div class="pct">${pct}%</div>` : ''}
  `;
  nav.appendChild(div);
}

function getTechPct(techId) {
  const tech = TECHS.find(t => t.id === techId);
  if (!tech) return 0;
  const all = tech.phases.flatMap(p => p.topics);
  if (all.length === 0) return 0;
  const done = all.filter(t => checkedTopics[t.id]).length;
  return Math.round((done / all.length) * 100);
}

function getTechHoursDone(techId) {
  const tech = TECHS.find(t => t.id === techId);
  if (!tech) return 0;
  return tech.phases.flatMap(p => p.topics).filter(t => checkedTopics[t.id]).reduce((s, t) => s + t.hrs, 0);
}

// ─── STATS ───
function updateStats() {
  const allTopics = TECHS.flatMap(t => t.phases.flatMap(p => p.topics));
  const totalTopics = allTopics.length;
  const doneTopics = allTopics.filter(t => checkedTopics[t.id]).length;
  const totalHours = TECHS.reduce((s, t) => s + t.hours, 0);
  const doneHours = allTopics.filter(t => checkedTopics[t.id]).reduce((s, t) => s + t.hrs, 0);
  const pct = totalTopics > 0 ? Math.round((doneTopics / totalTopics) * 100) : 0;
  const mastered = TECHS.filter(t => getTechPct(t.id) === 100).length;

  document.getElementById('stat-topics').textContent = `${doneTopics} / ${totalTopics}`;
  document.getElementById('stat-hours').textContent = `${doneHours} / ${totalHours}`;
  document.getElementById('stat-pct').textContent = `${pct}%`;
  document.getElementById('stat-mastered').textContent = mastered;
}

// ─── CONFETTI ───
function fireConfetti() {
  const emojis = ['🎉','🎊','⭐','🏆','✨','🔥','💪','🚀'];
  for (let i = 0; i < 40; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.top = '-20px';
    el.style.animationDelay = (Math.random() * 0.8) + 's';
    el.style.animationDuration = (1.8 + Math.random() * 1.5) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3500);
  }
}

// ─── COPY ───
function setupCopyButtons() {
  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      const code = this.closest('.code-block-wrap').querySelector('pre').textContent;
      navigator.clipboard.writeText(code).then(() => {
        this.textContent = '✓ Copied';
        this.classList.add('copied');
        setTimeout(() => { this.textContent = 'Copy'; this.classList.remove('copied'); }, 2000);
      });
    });
  });
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ─── TECH VIEW ───
function renderTechView(tech) {
  const pct = getTechPct(tech.id);
  const hrsDone = getTechHoursDone(tech.id);
  const allTopics = tech.phases.flatMap(p => p.topics);
  const doneCount = allTopics.filter(t => checkedTopics[t.id]).length;

  let html = `
    <div style="background:var(--bg-elevated);border-radius:var(--r-xl);padding:24px;margin-bottom:20px;box-shadow:var(--shadow-card);border:1px solid var(--border);display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap;">
      <div style="width:64px;height:64px;border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:var(--shadow-md);flex-shrink:0;background:${tech.color}20;">${tech.emoji}</div>
      <div style="flex:1;min-width:200px;">
        <h2 style="font-size:24px;font-weight:800;color:var(--txt-primary);letter-spacing:-0.03em;">${tech.name}</h2>
        <div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;">
          <span style="background:var(--bg-section);border-radius:var(--r-full);padding:3px 10px;font-size:12px;font-weight:500;color:var(--txt-secondary);">${tech.level}</span>
          <span style="background:var(--bg-section);border-radius:var(--r-full);padding:3px 10px;font-size:12px;font-weight:500;color:var(--txt-secondary);">${tech.hours}hrs total</span>
          <span style="background:var(--bg-section);border-radius:var(--r-full);padding:3px 10px;font-size:12px;font-weight:500;color:var(--txt-secondary);">${hrsDone}hrs done</span>
        </div>
        <div style="margin-top:14px;width:100%;">
          <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--txt-muted);font-weight:500;margin-bottom:6px;">
            <span>${doneCount} of ${allTopics.length} topics</span>
            <span style="color:var(--accent);font-weight:700;">${pct}%</span>
          </div>
          <div style="height:6px;background:var(--bg-section);border-radius:var(--r-full);overflow:hidden;">
            <div style="height:100%;border-radius:var(--r-full);background:linear-gradient(90deg,#007AFF,#5AC8FA);transition:width 0.6s cubic-bezier(0.34,1.56,0.64,1);width:${pct}%;"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="tabs-bar">
      <button class="tab-btn tech-tab-btn ${activeTechTab==='topics'?'active':''}" data-tab="topics">Topics</button>
      <button class="tab-btn tech-tab-btn ${activeTechTab==='commands'?'active':''}" data-tab="commands">Commands</button>
      <button class="tab-btn tech-tab-btn ${activeTechTab==='resources'?'active':''}" data-tab="resources">Resources</button>
      <button class="tab-btn tech-tab-btn ${activeTechTab==='projects'?'active':''}" data-tab="projects">Projects</button>
    </div>
  `;

  if (activeTechTab === 'topics') {
    tech.phases.forEach((phase, pi) => {
      const phaseTopics = phase.topics;
      const phaseDone = phaseTopics.filter(t => checkedTopics[t.id]).length;
      html += `<div class="phase-card">
        <div class="phase-header" data-phase="${tech.id}-${pi}">
          <div>
            <span style="font-size:14px;font-weight:700;color:var(--txt-primary);">${phase.title}</span>
            <span style="font-size:12px;color:var(--txt-muted);margin-left:8px;">${phase.meta || ''} · ${phaseDone}/${phaseTopics.length}</span>
          </div>
          <span class="phase-chevron" id="chevron-${tech.id}-${pi}">▶</span>
        </div>
        <div class="phase-topics" id="topics-${tech.id}-${pi}">`;
      phaseTopics.forEach(topic => {
        const checked = checkedTopics[topic.id];
        const done = checked ? 'done' : '';
        html += `<div class="topic-row ${done}" data-topic-row="${topic.id}">
          <div class="ios-checkbox ${checked ? 'checked' : ''}" data-chk="${topic.id}"></div>
          <span class="topic-text">${topic.label}</span>
          <span class="hours-badge">${topic.hrs}h</span>
        </div>`;
      });
      html += `</div></div>`;
    });
  } else if (activeTechTab === 'commands') {
    html += `<div class="code-block-wrap">
      <div class="code-block-header">
        <span class="code-block-lang">Shell</span>
        <button class="copy-btn">Copy</button>
      </div>
      <pre>${escapeHtml(tech.commands)}</pre>
    </div>`;
  } else if (activeTechTab === 'resources') {
    tech.resources.forEach(r => {
      html += `<a class="resource-card" href="${r.url}" target="_blank" rel="noopener">
        <div class="resource-icon">🔗</div>
        <div>
          <div class="r-title">${r.title}</div>
          <div class="r-url">${r.url}</div>
        </div>
        <span class="resource-chevron">›</span>
      </a>`;
    });
  } else if (activeTechTab === 'projects') {
    tech.projects.forEach((p,i) => {
      html += `<div class="project-card">
        <div class="project-num">${i+1}</div>
        <div class="p-title">${p.title}</div>
        <div class="p-desc">${p.desc}</div>
      </div>`;
    });
  }
  return html;
}

// ─── KNOWLEDGE BASE VIEW ───
function renderKBView() {
  let html = `
    <div style="margin-bottom:20px;">
      <h2 style="font-size:22px;font-weight:800;color:var(--txt-primary);letter-spacing:-0.03em;">📚 Senior Engineering Knowledge Base</h2>
      <p style="font-size:14px;color:var(--txt-muted);font-weight:400;margin-top:4px;">16 K8s chapters, Brian's notes, runbooks, architecture & labs</p>
    </div>
    <div class="search-bar">
      <span class="search-icon"><i data-lucide="search" class="w-4 h-4"></i></span>
      <input type="text" id="kb-search" placeholder="Search knowledge base..." />
    </div>
    <div class="tabs-bar">
      <button class="tab-btn kb-tab-btn ${activeKBTab==='chapters'?'active':''}" data-kbtab="chapters">Chapters</button>
      <button class="tab-btn kb-tab-btn ${activeKBTab==='notes'?'active':''}" data-kbtab="notes">Brian's Notes</button>
      <button class="tab-btn kb-tab-btn ${activeKBTab==='runbooks'?'active':''}" data-kbtab="runbooks">Runbooks</button>
      <button class="tab-btn kb-tab-btn ${activeKBTab==='architecture'?'active':''}" data-kbtab="architecture">Architecture</button>
      <button class="tab-btn kb-tab-btn ${activeKBTab==='labs'?'active':''}" data-kbtab="labs">Labs</button>
    </div>
    <div id="kb-content"></div>
  `;
  return html;
}

function renderKBContent(filter) {
  const container = document.getElementById('kb-content');
  if (!container) return;
  let html = '';
  const q = (filter || '').toLowerCase();

  if (activeKBTab === 'chapters') {
    KB_CHAPTERS.forEach((ch, idx) => {
      if (q && !ch.title.toLowerCase().includes(q) && !ch.rows.some(r => r[0].toLowerCase().includes(q) || r[1].toLowerCase().includes(q)) && !(ch.note||'').toLowerCase().includes(q)) return;
      html += `<div class="accordion" data-acc="${idx}">
        <div class="accordion-header" data-acc-toggle="${idx}">
          <span class="acc-arrow">▶</span>
          <span>${ch.badge}</span>
          <span>Ch${ch.num} – ${ch.title}</span>
        </div>
        <div class="accordion-body" data-acc-body="${idx}">
          <div class="accordion-body-inner">
            <div style="overflow-x:auto;">
              <table class="kb-table">
                <thead><tr><th>Component</th><th>Details</th></tr></thead>
                <tbody>${ch.rows.map(r => `<tr><td style="color:${ch.color};">${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</tbody>
              </table>
            </div>
            ${ch.note ? `<div class="kb-note">📝 <b>Key Insight:</b> ${ch.note}</div>` : ''}
            ${ch.extraCode ? `<div class="code-block-wrap" style="margin-top:12px;"><div class="code-block-header"><span class="code-block-lang">Shell</span><button class="copy-btn">Copy</button></div><pre>${escapeHtml(ch.extraCode)}</pre></div>` : ''}
          </div>
        </div>
      </div>`;
    });
  } else if (activeKBTab === 'notes') {
    KB_BRIANS_NOTES.forEach((note, idx) => {
      if (q && !note.title.toLowerCase().includes(q) && !note.content.toLowerCase().includes(q)) return;
      html += `<div class="accordion" data-acc="n${idx}">
        <div class="accordion-header" data-acc-toggle="n${idx}">
          <span class="acc-arrow">▶</span>
          <span>📝</span>
          <span>${note.title}</span>
        </div>
        <div class="accordion-body" data-acc-body="n${idx}">
          <div class="accordion-body-inner">
            <div style="font-size:14px;color:var(--txt-secondary);line-height:1.8;white-space:pre-wrap;">${note.content}</div>
          </div>
        </div>
      </div>`;
    });
  } else if (activeKBTab === 'runbooks') {
    KB_RUNBOOKS.forEach(rb => {
      if (q && !rb.title.toLowerCase().includes(q) && !rb.steps.some(s => s.toLowerCase().includes(q))) return;
      const sevClass = rb.severity === 'critical' ? 'sev-critical' : rb.severity === 'high' ? 'sev-high' : 'sev-medium';
      html += `<div class="runbook-card">
        <div class="rb-title">${rb.emoji} ${rb.title} <span class="severity-badge ${sevClass}">${rb.severity.toUpperCase()}</span></div>
        <ol>${rb.steps.map(s => `<li>${s}</li>`).join('')}</ol>
      </div>`;
    });
  } else if (activeKBTab === 'architecture') {
    KB_ARCHITECTURE.forEach(arch => {
      if (q && !arch.title.toLowerCase().includes(q) && !arch.diagram.toLowerCase().includes(q)) return;
      html += `<div style="margin:16px 0;">
        <h3 style="font-size:16px;font-weight:700;color:var(--txt-primary);margin-bottom:10px;">${arch.title}</h3>
        <div class="arch-diagram">${escapeHtml(arch.diagram)}</div>
      </div>`;
    });
  } else if (activeKBTab === 'labs') {
    KB_LABS.forEach((lab, i) => {
      if (q && !lab.title.toLowerCase().includes(q) && !lab.steps.some(s => s.toLowerCase().includes(q))) return;
      html += `<div class="lab-card">
        <div class="lab-title"><span style="display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:9px;background:var(--accent-green);color:white;font-size:14px;font-weight:700;">🔬</span> ${lab.title}</div>
        <ol>${lab.steps.map(s => `<li>${s}</li>`).join('')}</ol>
      </div>`;
    });
  }
  container.innerHTML = html || '<div style="text-align:center;padding:48px 24px;color:var(--txt-muted);"><div style="font-size:40px;margin-bottom:12px;">🔍</div><h3 style="font-size:17px;font-weight:600;color:var(--txt-secondary);margin-bottom:6px;">No results found</h3><p style="font-size:14px;">Try a different search term.</p></div>';

  container.querySelectorAll('.accordion-header').forEach(hdr => {
    hdr.addEventListener('click', function() {
      const key = this.dataset.accToggle;
      const body = container.querySelector(`[data-acc-body="${key}"]`);
      body.classList.toggle('open');
      this.classList.toggle('open');
    });
  });
  setupCopyButtons();
  if (typeof lucide !== "undefined" && typeof lucide.createIcons === "function") lucide.createIcons();
}

// ─── MAIN RENDER ───
function render() {
  renderSidebar();
  updateStats();
  const content = document.getElementById('content-area');

  if (activeItem === 'kb') {
    content.innerHTML = renderKBView();
    content.querySelectorAll('.kb-tab-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        activeKBTab = this.dataset.kbtab;
        content.querySelectorAll('.kb-tab-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        renderKBContent(document.getElementById('kb-search')?.value || '');
      });
    });
    const searchInput = document.getElementById('kb-search');
    if (searchInput) {
      searchInput.addEventListener('input', function() { renderKBContent(this.value); });
    }
    renderKBContent('');
  } else {
    const tech = TECHS.find(t => t.id === activeItem);
    if (tech) {
      content.innerHTML = renderTechView(tech);
      attachTechEventListeners(tech);
    }
  }
  if (typeof lucide !== "undefined" && typeof lucide.createIcons === "function") lucide.createIcons();
}

function attachTechEventListeners(tech) {
  // Phase toggle
  document.querySelectorAll('.phase-header').forEach(hdr => {
    hdr.addEventListener('click', function() {
      const phaseId = this.dataset.phase;
      const topics = document.getElementById('topics-' + phaseId);
      const chevron = document.getElementById('chevron-' + phaseId);
      if (topics) {
        topics.classList.toggle('collapsed');
        if (chevron) chevron.classList.toggle('open');
      }
    });
  });

  // Checkbox toggle
  document.querySelectorAll('.ios-checkbox').forEach(chk => {
    chk.addEventListener('click', function(e) {
      e.stopPropagation();
      const topicId = this.dataset.chk;
      const isChecked = !checkedTopics[topicId];
      checkedTopics[topicId] = isChecked;
      if (!isChecked) delete checkedTopics[topicId];
      save();

      this.classList.toggle('checked', isChecked);
      const row = this.closest('.topic-row');
      if (row) row.classList.toggle('done', isChecked);

      updateStats();
      renderSidebar();

      if (tech) {
        const pct = getTechPct(tech.id);
        if (pct === 100 && !celebratedTechs[tech.id]) {
          celebratedTechs[tech.id] = true;
          save();
          fireConfetti();
        }
      }
    });
  });

  // Topic row click → toggle checkbox
  document.querySelectorAll('.topic-row').forEach(row => {
    row.addEventListener('click', function(e) {
      if (e.target.closest('.ios-checkbox')) return;
      const chk = this.querySelector('.ios-checkbox');
      if (chk) chk.click();
    });
  });

  // Tab buttons
  document.querySelectorAll('.tech-tab-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      activeTechTab = this.dataset.tab;
      render();
    });
  });
  setupCopyButtons();
}

// ─── MOBILE MENU ───
function setupMobile() {
  const toggleBtn = document.getElementById('mobile-toggle-btn');
  const sidebar = document.getElementById('sidebar');
  if (window.innerWidth <= 768) toggleBtn.style.display = 'flex';
  toggleBtn.addEventListener('click', function() { sidebar.classList.toggle('open'); });
  window.addEventListener('resize', function() {
    if (window.innerWidth <= 768) { toggleBtn.style.display = 'flex'; }
    else { toggleBtn.style.display = 'none'; sidebar.classList.remove('open'); }
  });
}

// ─── INIT ───
if (typeof lucide !== "undefined" && typeof lucide.createIcons === "function") lucide.createIcons();
setupMobile();
render();
</script>
</body>
</html>
