   │ kubelet → CRI → containerd → runc          │
   │ kube-proxy (iptables/eBPF)                 │
   │ CNI plugin (Calico/Cilium/Flannel)         │
   └────────────────────────────────────────────┘`},
{title:'Service Traffic Flow',content:`Client Request → kube-proxy (iptables/eBPF)
  → ClusterIP VIP → EndpointSlice
  → CNI network → Pod IP → Container port`},
{title:'K8s API Request Flow',content:`kubectl → TLS → kube-apiserver → Authentication
  → Authorization (RBAC) → Mutating Admission
  → Schema Validation → Validating Admission
  → etcd (persist) → Response`}
];

const TABS = ['topics','commands','resources','projects'];
const TAB_LABELS = ['Topics','Commands','Resources','Projects'];
const TAB_ICONS = ['list-checks','terminal','bookmark','hammer'];

const KB_TABS = ['all','notes','runbooks','architecture','labs'];
const KB_TAB_LABELS = ['All Chapters','Brian\'s Notes','Runbooks','Architecture','Labs'];
const KB_TAB_ICONS = ['book-open','sticky-note','alert-triangle','layers','flask-conical'];

/* ═══════════════════ STATE ═══════════════════ */
const SK = 'devops_brian_v4';
let S = {completed:{},activeTech:'python',activeTab:'topics',kbTab:'all',kbSearch:''};

function loadS(){try{const d=localStorage.getItem(SK);if(d){const p=JSON.parse(d);S.completed=p.completed||{};S.activeTech=p.activeTech||'python';S.activeTab=p.activeTab||'topics';S.kbTab=p.kbTab||'all';S.kbSearch=p.kbSearch||'';}}catch(e){}}
function saveS(){try{localStorage.setItem(SK,JSON.stringify(S));}catch(e){}}
function resetAll(){S.completed={};saveS();renderAll();}

/* ═══════════════════ CALCULATIONS ═══════════════════ */
function allTopics(t){return t.phases.flatMap(p=>p.topics);}
function techProg(t){const ts=allTopics(t),d=ts.filter(x=>S.completed[x.id]).length;return{done:d,total:ts.length,pct:ts.length?Math.round(d/ts.length*100):0};}
function techHours(t){const ts=allTopics(t);return{done:ts.filter(x=>S.completed[x.id]).reduce((s,x)=>s+x.hours,0),total:ts.reduce((s,x)=>s+x.hours,0)};}
function overallStats(){let tt=0,dt=0,th=0,dh=0,m=0;techData.forEach(t=>{const ts=allTopics(t),d=ts.filter(x=>S.completed[x.id]).length;tt+=ts.length;dt+=d;th+=ts.reduce((s,x)=>s+x.hours,0);dh+=ts.filter(x=>S.completed[x.id]).reduce((s,x)=>s+x.hours,0);if(ts.length>0&&d===ts.length)m++;});return{tt,dt,th,dh,pct:tt?Math.round(dt/tt*100):0,m};}

/* ═══════════════════ CONFETTI ═══════════════════ */
function confetti(){const c=document.createElement('div');c.className='confetti-container';document.body.appendChild(c);const cols=['#7c3aed','#06b6d4','#10b981','#f59e0b','#ef4444','#8b5cf6','#3b82f6','#ec4899'];for(let i=0;i<60;i++){const p=document.createElement('div');p.className='confetti-piece';p.style.left=Math.random()*100+'%';p.style.background=cols[Math.floor(Math.random()*cols.length)];p.style.animationDelay=Math.random()+'s';p.style.animationDuration=(2+Math.random()*2)+'s';p.style.width=(6+Math.random()*8)+'px';p.style.height=(6+Math.random()*8)+'px';c.appendChild(p);}setTimeout(()=>c.remove(),4000);}

/* ═══════════════════ HELPERS ═══════════════════ */
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function codeBlock(code,color){
const id='cb'+Math.random().toString(36).substr(2,6);
return `<div class="code-block" style="border-left: 3px solid ${color||'#7c3aed'};" id="${id}"><button class="copy-btn" data-copy="${id}">📋 Copy</button><pre><code>${escHtml(code)}</code></pre></div>`;
}

/* ═══════════════════ SIDEBAR ═══════════════════ */
function renderSidebar(){
['sidebar-tech-list','mobile-tech-list'].forEach(cid=>{
const c=document.getElementById(cid);if(!c)return;c.innerHTML='';
techData.forEach(t=>{
const p=techProg(t),a=S.activeTech===t.id;
const b=document.createElement('button');
b.className=`sidebar-item w-full text-left px-3 py-2 rounded-lg flex items-center gap-2.5 ${a?'active':''}`;
b.innerHTML=`<div class="w-7 h-7 rounded-lg flex items-center justify-center flex-shrink-0 text-sm" style="background:${t.color}22">${t.icon}</div><div class="flex-1 min-w-0"><div class="flex items-center justify-between"><span class="text-[12px] font-medium ${a?'text-white':'text-surface-200'} truncate">${t.name}</span><span class="text-[9px] font-bold tabular-nums ${p.pct===100?'text-green-400':'text-surface-400'}">${p.pct}%</span></div><div class="progress-track h-1 mt-1"><div class="progress-fill h-full" style="width:${p.pct}%;background:${t.color}"></div></div></div>${p.pct===100?'<span class="text-[10px]">🏆</span>':''}`;
b.addEventListener('click',()=>{S.activeTech=t.id;S.activeTab='topics';saveS();renderAll();closeMobile();});
c.appendChild(b);
});
// Knowledge Base button
const kb=document.createElement('button');
const isKB=S.activeTech==='knowledgebase';
kb.className=`sidebar-item w-full text-left px-3 py-2 rounded-lg flex items-center gap-2.5 mt-3 border-t border-white/5 pt-3 ${isKB?'active':''}`;
kb.innerHTML=`<div class="w-7 h-7 rounded-lg flex items-center justify-center flex-shrink-0 text-sm" style="background:#7c3aed22">📚</div><div class="flex-1 min-w-0"><div class="flex items-center gap-2"><span class="text-[12px] font-medium ${isKB?'text-white':'text-surface-200'}">Knowledge Base</span><span class="kb-badge-new">NEW</span></div></div>`;
kb.addEventListener('click',()=>{S.activeTech='knowledgebase';saveS();renderAll();closeMobile();});
c.appendChild(kb);
});
}

/* ═══════════════════ RENDER DETAIL ═══════════════════ */
function renderDetail(){
const panel=document.getElementById('detail-panel');
if(S.activeTech==='knowledgebase'){renderKnowledgeBase(panel);return;}
const tech=techData.find(t=>t.id===S.activeTech);if(!tech){panel.innerHTML='';return;}
const p=techProg(tech),h=techHours(tech);
let tabHtml='';
TABS.forEach((tab,i)=>{
const isActive=S.activeTab===tab;
tabHtml+=`<button class="tab-btn flex-shrink-0 px-3 py-2 text-[11px] md:text-xs font-medium whitespace-nowrap transition-all ${isActive?'tab-active':'tab-inactive'}" data-tab="${tab}"><span class="flex items-center gap-1"><i data-lucide="${TAB_ICONS[i]}" class="w-3.5 h-3.5"></i> ${TAB_LABELS[i]}</span></button>`;
});

panel.innerHTML=`<div class="fade-in">
<div class="rounded-2xl p-4 md:p-5 mb-4 gradient-border" style="background:#1a1d2e;">
<div class="flex flex-col sm:flex-row sm:items-center gap-3 mb-3">
<div class="flex items-center gap-3 flex-1"><div class="w-10 h-10 rounded-xl flex items-center justify-center text-xl flex-shrink-0" style="background:${tech.color}22">${tech.icon}</div><div><h2 class="font-display text-lg md:text-xl font-bold text-white">${tech.name}</h2><div class="flex items-center gap-2 mt-1 flex-wrap"><span class="text-[10px] font-semibold px-2 py-0.5 rounded-lg bg-white/5 text-surface-300">${tech.difficulty}</span><span class="text-[10px] text-surface-400 flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i>${tech.hours}hrs</span></div></div></div>
<div class="text-right flex-shrink-0"><p class="text-xl font-bold tabular-nums" style="color:${tech.color}">${p.pct}%</p><p class="text-[10px] text-surface-400">${p.done}/${p.total} topics · ${h.done}/${h.total}hrs</p></div>
</div>
<div class="progress-track h-2"><div class="progress-fill h-full" style="width:${p.pct}%;background:${tech.color}"></div></div>
${p.pct===100?'<div class="mt-2 text-center text-xs font-semibold text-green-400">🎉 Mastered!</div>':''}
</div>
<div class="tab-scroll flex gap-0.5 mb-4 border-b border-white/5 pb-0">${tabHtml}</div>
<div id="tab-content"></div>
</div>`;
initLucide();
panel.querySelectorAll('.tab-btn').forEach(b=>{b.addEventListener('click',()=>{S.activeTab=b.dataset.tab;saveS();renderTabContent(tech);panel.querySelectorAll('.tab-btn').forEach(x=>x.className=x.className.replace('tab-active','tab-inactive'));b.className=b.className.replace('tab-inactive','tab-active');});});
renderTabContent(tech);
}

function renderTabContent(tech){
const a=document.getElementById('tab-content');if(!a)return;
switch(S.activeTab){
case 'topics':renderTopics(a,tech);break;
case 'commands':renderCommands(a,tech);break;
case 'resources':renderResources(a,tech);break;
case 'projects':renderProjects(a,tech);break;
}
initLucide();initCopyBtns();
}

function renderTopics(a,tech){
let h='<div class="space-y-2 fade-in">';
tech.phases.forEach((ph,pi)=>{
const pts=ph.topics,pd=pts.filter(t=>S.completed[t.id]).length,pp=pts.length?Math.round(pd/pts.length*100):0;
h+=`<div class="rounded-xl overflow-hidden" style="background:#1a1d2e;border:1px solid rgba(255,255,255,0.05);">
<button class="accordion-header w-full text-left px-4 py-3 flex items-center gap-2 hover:bg-white/[0.02] transition-colors" data-phase="${pi}">
<i data-lucide="chevron-down" class="w-3.5 h-3.5 text-surface-400 transition-transform accordion-chevron"></i>
<div class="flex-1 min-w-0"><div class="flex flex-col sm:flex-row sm:items-center gap-0.5 sm:gap-2"><h3 class="text-xs font-semibold text-surface-100">${ph.title}</h3></div></div>
<div class="flex items-center gap-2 flex-shrink-0"><div class="progress-track h-1 w-12 hidden sm:block"><div class="progress-fill h-full" style="width:${pp}%;background:${tech.color}"></div></div><span class="text-[10px] font-bold tabular-nums ${pp===100?'text-green-400':'text-surface-400'}">${pd}/${pts.length}</span></div>
</button>
<div class="accordion-content open" data-phase-content="${pi}"><div class="px-3 pb-2 space-y-1">`;
pts.forEach(topic=>{
const done=S.completed[topic.id];
h+=`<div class="flex items-center gap-2.5 p-2 rounded-lg hover:bg-white/[0.02] transition-colors ${done?'topic-done':''}" data-topic-row="${topic.id}">
<input type="checkbox" class="checkbox-custom" data-topic-id="${topic.id}" ${done?'checked':''} />
<span class="topic-text text-[12px] flex-1 ${done?'text-surface-500':'text-surface-200'}">${topic.text}</span>
<span class="text-[9px] text-surface-500 flex-shrink-0 bg-white/5 px-1.5 py-0.5 rounded">${topic.hours}h</span>
${done?'<i data-lucide="check-circle-2" class="w-3.5 h-3.5 text-green-400 flex-shrink-0"></i>':''}
</div>`;
});
h+=`</div></div></div>`;
});
h+='</div>';
a.innerHTML=h;
a.querySelectorAll('.accordion-header').forEach(hd=>{hd.addEventListener('click',()=>{const c=a.querySelector(`[data-phase-content="${hd.dataset.phase}"]`);const ch=hd.querySelector('.accordion-chevron');if(c)c.classList.toggle('open');if(ch)ch.classList.toggle('-rotate-90');});});
a.querySelectorAll('.checkbox-custom').forEach(cb=>{cb.addEventListener('change',()=>{
const id=cb.dataset.topicId;const t=techData.find(x=>x.id===S.activeTech);const wasMastered=t?techProg(t).pct===100:false;
if(cb.checked)S.completed[id]=true;else delete S.completed[id];saveS();
if(!wasMastered&&t&&techProg(t).pct===100)confetti();
renderAll();
});});
}

function renderCommands(a,tech){
if(!tech.commands){a.innerHTML='<p class="text-sm text-surface-400">No commands yet.</p>';return;}
a.innerHTML=`<div class="fade-in space-y-3"><div class="flex items-center gap-2 mb-2"><i data-lucide="terminal" class="w-5 h-5" style="color:${tech.color}"></i><h3 class="font-display text-sm font-bold text-white">Command Reference</h3></div>${codeBlock(tech.commands,tech.color)}</div>`;
}

items.forEach(r=>{

<div class="flex items-start gap-2.5">
<div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0" style="background:${tech.color}22"><i data-lucide="external-link" class="w-4 h-4" style="color:${tech.color}"></i></div>

}

<div class="flex items-start gap-2.5">
<div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0" style="background:${tech.color}22"><span class="text-xs font-bold" style="color:${tech.color}">${i+1}</span></div>

</div></div>`;

/* ═══════════════════ KNOWLEDGE BASE RENDER ═══════════════════ */
function renderKnowledgeBase(panel){
const search=S.kbSearch||'';
let tabHtml='';
KB_TABS.forEach((tab,i)=>{
const isActive=S.kbTab===tab;
tabHtml+=`<button class="kb-tab-btn flex-shrink-0 px-3 py-2 text-[11px] md:text-xs font-medium whitespace-nowrap transition-all ${isActive?'tab-active':'tab-inactive'}" data-kbtab="${tab}"><span class="flex items-center gap-1"><i data-lucide="${KB_TAB_ICONS[i]}" class="w-3.5 h-3.5"></i> ${KB_TAB_LABELS[i]}</span></button>`;
});
panel.innerHTML=`<div class="fade-in">
<div class="rounded-2xl p-4 md:p-5 mb-4 gradient-border" style="background:#1a1d2e;">
<h2 class="font-display text-lg md:text-xl font-bold gradient-text mb-1">📚 Senior Engineering Knowledge Base</h2>
<p class="text-xs text-surface-400">All chapters, runbooks, labs and Brian's personal notes</p>
</div>
<div class="relative mb-4">
<i data-lucide="search" class="w-4 h-4 text-surface-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
<input type="text" id="kb-search-input" class="kb-search-input" placeholder="Search chapters, notes, runbooks..." value="${escHtml(search)}" />
</div>
<div class="tab-scroll flex gap-0.5 mb-4 border-b border-white/5 pb-0">${tabHtml}</div>
<div id="kb-tab-content"></div>
</div>`;
initLucide();
panel.querySelectorAll('.kb-tab-btn').forEach(b=>{b.addEventListener('click',()=>{S.kbTab=b.dataset.kbtab;saveS();panel.querySelectorAll('.kb-tab-btn').forEach(x=>x.className=x.className.replace('tab-active','tab-inactive'));b.className=b.className.replace('tab-inactive','tab-active');renderKBTabContent();});});
const si=document.getElementById('kb-search-input');
if(si){si.addEventListener('input',()=>{S.kbSearch=si.value;saveS();renderKBTabContent();});}
renderKBTabContent();
}

function renderKBTabContent(){
const a=document.getElementById('kb-tab-content');if(!a)return;
const q=(S.kbSearch||'').toLowerCase().trim();
switch(S.kbTab){
case 'all':renderKBChapters(a,q);break;
case 'notes':renderKBNotes(a,q);break;
case 'runbooks':renderKBRunbooks(a,q);break;
case 'architecture':renderKBArchitecture(a,q);break;
case 'labs':renderKBLabs(a,q);break;
}
initLucide();initCopyBtns();
}

function matchSearch(text,q){if(!q)return true;return text.toLowerCase().includes(q);}

function renderKBChapters(a,q){
const filtered=KB_CHAPTERS.filter(ch=>{if(!q)return true;return (ch.title+' '+ch.rows.map(r=>r.join(' ')).join(' ')+' '+(ch.engNote||'')).toLowerCase().includes(q);});
if(!filtered.length){a.innerHTML='<p class="text-sm text-surface-400 text-center py-8">No chapters match your search.</p>';return;}
let h='<div class="space-y-2 fade-in">';
filtered.forEach((ch,ci)=>{
let tableH=`<div class="overflow-x-auto mt-3"><table class="kb-table"><thead><tr><th>Component</th><th>Senior-Level Knowledge</th></tr></thead><tbody>`;
ch.rows.forEach(r=>{tableH+=`<tr><td>${escHtml(r[0])}</td><td>${escHtml(r[1])}</td></tr>`;});
tableH+='</tbody></table></div>';
const engNoteH=ch.engNote?`<div class="kb-eng-note"><p>💡 ${escHtml(ch.engNote)}</p></div>`:'';
h+=`<div class="kb-chapter-card rounded-xl overflow-hidden" style="border-left:3px solid ${ch.borderColor}">
<button class="accordion-header w-full text-left px-4 py-3 flex items-center gap-3 hover:bg-white/[0.02]" data-phase="kbc${ci}">
<i data-lucide="chevron-down" class="w-3.5 h-3.5 text-surface-400 accordion-chevron -rotate-90"></i>
<span class="text-xs font-bold text-surface-300 tabular-nums w-6">${ch.num}</span>
<span class="text-xs font-semibold text-surface-100 flex-1">${ch.title}</span>
<span class="text-[10px] font-semibold px-2 py-0.5 rounded-full" style="background:${ch.badgeColor}22;color:${ch.badgeColor}">${ch.badge}</span>
</button>
<div class="accordion-content" data-phase-content="kbc${ci}"><div class="px-4 pb-4">${tableH}${engNoteH}</div></div>
</div>`;
});
h+='</div>';a.innerHTML=h;
a.querySelectorAll('.accordion-header').forEach(hd=>{hd.addEventListener('click',()=>{const c=a.querySelector(`[data-phase-content="${hd.dataset.phase}"]`);const ch=hd.querySelector('.accordion-chevron');if(c)c.classList.toggle('open');if(ch)ch.classList.toggle('-rotate-90');});});
}

function renderKBNotes(a,q){
const filtered=KB_BRIAN_NOTES.filter(n=>matchSearch(n.title+(n.code||'')+(n.note||'')+(n.summary||''),q));
if(!filtered.length){a.innerHTML='<p class="text-sm text-surface-400 text-center py-8">No notes match.</p>';return;}
let h='<div class="space-y-2 fade-in">';
filtered.forEach((note,ni)=>{
let contentH='';
if(note.type==='cards'){
contentH+='<div class="grid grid-cols-1 sm:grid-cols-3 gap-2 mt-3">';
note.cards.forEach(card=>{
contentH+=`<div class="${card.cls} rounded-xl p-3"><h5 class="text-[11px] font-bold mb-0.5" style="color:${card.color}">${card.label}</h5><p class="text-[10px] text-surface-400 mb-2">${card.subtitle}</p>`;
card.cmds.forEach(cmd=>{contentH+=`<code class="block text-[10px] font-mono text-surface-200 bg-black/20 rounded px-2 py-1 mb-1 overflow-x-auto">${escHtml(cmd)}</code>`;});
contentH+='</div>';
});
contentH+='</div>';
if(note.summary)contentH+=`<div class="mt-2 text-[11px] font-semibold text-yellow-300 bg-yellow-500/10 rounded-lg px-3 py-2">${note.summary}</div>`;
} else {
if(note.code)contentH+=`<div class="mt-3">${codeBlock(note.code,'#f59e0b')}</div>`;
if(note.note)contentH+=`<div class="mt-2 text-[11px] text-surface-300 bg-white/[0.02] rounded-lg px-3 py-2 whitespace-pre-line">${escHtml(note.note)}</div>`;
}
h+=`<div class="brian-note-card rounded-xl overflow-hidden">
<button class="accordion-header w-full text-left px-4 py-3 flex items-center gap-2 hover:bg-white/[0.02]" data-phase="bn${ni}">
<i data-lucide="chevron-down" class="w-3.5 h-3.5 text-surface-400 accordion-chevron -rotate-90"></i>
<span class="text-xs font-semibold text-surface-100 flex-1">${note.title}</span>
</button>
<div class="accordion-content" data-phase-content="bn${ni}"><div class="px-4 pb-4">${contentH}</div></div>
</div>`;
});
h+='</div>';a.innerHTML=h;
a.querySelectorAll('.accordion-header').forEach(hd=>{hd.addEventListener('click',()=>{const c=a.querySelector(`[data-phase-content="${hd.dataset.phase}"]`);const ch=hd.querySelector('.accordion-chevron');if(c)c.classList.toggle('open');if(ch)ch.classList.toggle('-rotate-90');});});
}

function renderKBRunbooks(a,q){
const filtered=KB_RUNBOOKS.filter(r=>matchSearch(r.title+(r.steps?r.steps.join(' '):'')+(r.code||''),q));
if(!filtered.length){a.innerHTML='<p class="text-sm text-surface-400 text-center py-8">No runbooks match.</p>';return;}
let h='<div class="space-y-2 fade-in">';
filtered.forEach((rb,ri)=>{
const sevLabel=rb.severity==='critical'?'🔴 Critical':rb.severity==='high'?'🟠 High':'🟡 Medium';
const sevCls=rb.severity==='critical'?'severity-critical':rb.severity==='high'?'severity-high':'severity-medium';
let contentH='';
if(rb.isCode){contentH=`<div class="mt-3">${codeBlock(rb.code,'#7c3aed')}</div>`;
}else{contentH='<ol class="mt-3 space-y-1.5">';rb.steps.forEach((step,si)=>{contentH+=`<li class="flex items-start gap-2"><span class="text-[10px] font-bold text-surface-400 mt-0.5 w-4 flex-shrink-0">${si+1}.</span><span class="text-[12px] text-surface-200">${escHtml(step)}</span></li>`;});contentH+='</ol>';}
h+=`<div class="rounded-xl overflow-hidden" style="background:#1a1d2e;border:1px solid rgba(255,255,255,0.05);">
<button class="accordion-header w-full text-left px-4 py-3 flex items-center gap-3 hover:bg-white/[0.02]" data-phase="rb${ri}">
<i data-lucide="chevron-down" class="w-3.5 h-3.5 text-surface-400 accordion-chevron -rotate-90"></i>
<span class="text-xs font-semibold text-surface-100 flex-1">${rb.title}</span>
<span class="text-[10px] font-semibold px-2 py-0.5 rounded-full ${sevCls}">${sevLabel}</span>
</button>
<div class="accordion-content" data-phase-content="rb${ri}"><div class="px-4 pb-4">${contentH}</div></div>
</div>`;
});
h+='</div>';a.innerHTML=h;
a.querySelectorAll('.accordion-header').forEach(hd=>{hd.addEventListener('click',()=>{const c=a.querySelector(`[data-phase-content="${hd.dataset.phase}"]`);const ch=hd.querySelector('.accordion-chevron');if(c)c.classList.toggle('open');if(ch)ch.classList.toggle('-rotate-90');});});
}

function renderKBArchitecture(a,q){
const filtered=KB_ARCH_DIAGRAMS.filter(d=>matchSearch(d.title+(d.content||''),q));
if(!filtered.length){a.innerHTML='<p class="text-sm text-surface-400 text-center py-8">No diagrams match.</p>';return;}
let h='<div class="space-y-3 fade-in">';
filtered.forEach(diag=>{

<pre class="text-[11px] text-surface-200 overflow-x-auto font-mono bg-[#0d1117] p-4 rounded-lg mt-3" style="border-left:3px solid #7c3aed">${escHtml(diag.content)}</pre>
</div>`;
});
h+='</div>';a.innerHTML=h;
}

function renderKBLabs(a,q){
const filtered=KB_LABS.filter(l=>matchSearch(l.title+(l.code||''),q));

let h='<div class="space-y-2 fade-in">';

h+=`<div class="rounded-xl overflow-hidden" style="background:#1a1d2e;border:1px solid rgba(255,255,255,0.05);">

<div class="flex items-center justify-center w-7 h-7 rounded-full gradient-bar flex-shrink-0"><span class="text-[11px] font-bold text-white">${lab.num}</span></div>
<span class="text-xs font-semibold text-surface-100 flex-1">${lab.title}</span>
</button>
<div class="accordion-content" data-phase-content="lb${li}"><div class="px-4 pb-4">${contentH}</div></div>

});
h+='</div>';a.innerHTML=h;
a.querySelectorAll('.accordion-header').forEach(hd=>{hd.addEventListener('click',()=>{const c=a.querySelector(`[data-phase-content="${hd.dataset.phase}"]`);const ch=hd.querySelector('.accordion-chevron');if(c)c.classList.toggle('open');if(ch)ch.classList.toggle('-rotate-90');});});
}

/* ═══════════════════ STATS ═══════════════════ */
function renderStats(){
const s=overallStats();
document.getElementById('overall-progress-bar').style.width=s.pct+'%';
document.getElementById('overall-progress-text').textContent=s.pct+'%';
document.getElementById('stat-done').textContent=s.dt+'/'+s.tt;
document.getElementById('stat-hours').textContent=s.dh+'/'+s.th;
document.getElementById('stat-percent').textContent=s.pct+'%';
document.getElementById('stat-mastered').textContent=s.m+'/8';
}

/* ═══════════════════ COPY BUTTONS ═══════════════════ */
function initCopyBtns(){
document.querySelectorAll('[data-copy]').forEach(btn=>{
btn.removeEventListener('click',handleCopy);
btn.addEventListener('click',handleCopy);
});
}
function handleCopy(e){
const btn=e.currentTarget;
const block=document.getElementById(btn.dataset.copy);
if(!block)return;
const code=block.querySelector('code');
if(!code)return;
navigator.clipboard.writeText(code.innerText).then(()=>{
btn.textContent='✅ Copied!';
setTimeout(()=>{btn.textContent='📋 Copy';},2000);
}).catch(()=>{btn.textContent='❌ Failed';setTimeout(()=>{btn.textContent='📋 Copy';},2000);});
}

/* ═══════════════════ LUCIDE ═══════════════════ */
function initLucide(){if(typeof lucide!=="undefined"&&typeof lucide.createIcons==="function")lucide.createIcons();}

/* ═══════════════════ RENDER ALL ═══════════════════ */
function renderAll(){renderSidebar();renderDetail();renderStats();}

/* ═══════════════════ MOBILE ═══════════════════ */
function closeMobile(){const o=document.getElementById('mobile-overlay');if(o)o.style.display='none';}
document.getElementById('mobile-menu-btn').addEventListener('click',()=>{const o=document.getElementById('mobile-overlay');if(o)o.style.display='block';});
document.getElementById('mobile-close-btn').addEventListener('click',closeMobile);
document.getElementById('mobile-overlay').addEventListener('click',(e)=>{if(e.target===e.currentTarget)closeMobile();});

/* ═══════════════════ RESET MODAL ═══════════════════ */
const rm=document.getElementById('reset-modal');
document.getElementById('reset-all-btn').addEventListener('click',()=>{rm.style.display='flex';});
document.getElementById('reset-cancel-btn').addEventListener('click',()=>{rm.style.display='none';});
document.getElementById('reset-confirm-btn').addEventListener('click',()=>{rm.style.display='none';resetAll();});
rm.addEventListener('click',(e)=>{if(e.target===e.currentTarget)rm.style.display='none';});

/* ═══════════════════ INIT ═══════════════════ */
loadS();
renderAll();
</script>
