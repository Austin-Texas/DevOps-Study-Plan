<style>
:root {
  --bg-base:#0f1117; --bg-card:#1a1d2e; --bg-elevated:#222538;
  --grad-start:#7c3aed; --grad-end:#06b6d4;
  --txt-primary:#f1f5f9; --txt-secondary:#cbd5e1; --txt-muted:#94a3b8;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg-base); color:var(--txt-primary); font-family:'Inter',sans-serif; }
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:var(--bg-base); }
::-webkit-scrollbar-thumb { background:#475569; border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:#64748b; }

.sidebar { position:fixed; left:0; top:0; bottom:0; width:260px; background:var(--bg-card); border-right:1px solid rgba(124,58,237,0.15); overflow-y:auto; z-index:40; display:flex; flex-direction:column; }
.main-panel { margin-left:260px; min-height:100vh; display:flex; flex-direction:column; }

.sidebar-item { display:flex; align-items:center; gap:10px; padding:10px 14px; margin:3px 10px; border-radius:10px; cursor:pointer; transition:all 0.2s; border-left:3px solid transparent; position:relative; }
.sidebar-item:hover { background:rgba(124,58,237,0.1); }
.sidebar-item.active { background:linear-gradient(135deg,rgba(124,58,237,0.2),rgba(6,182,212,0.1)); border-left-color:#7c3aed; }
.sidebar-item .icon-bubble { width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
.sidebar-item .item-info { flex:1; min-width:0; }
.sidebar-item .item-name { font-size:13px; font-weight:600; color:var(--txt-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sidebar-item .mini-bar { height:4px; background:rgba(255,255,255,0.08); border-radius:2px; margin-top:4px; overflow:hidden; }
.sidebar-item .mini-bar-fill { height:100%; border-radius:2px; transition:width 0.5s; }
.sidebar-item .pct { font-size:11px; font-weight:700; color:var(--txt-muted); min-width:32px; text-align:right; }

.stats-bar { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; padding:16px 24px; background:var(--bg-card); border-bottom:1px solid rgba(124,58,237,0.12); }
.stat-card { text-align:center; padding:10px 6px; border-radius:10px; background:rgba(255,255,255,0.03); }
.stat-card .stat-value { font-size:22px; font-weight:800; background:linear-gradient(135deg,#7c3aed,#06b6d4); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.stat-card .stat-label { font-size:11px; color:var(--txt-muted); margin-top:2px; font-weight:500; text-transform:uppercase; letter-spacing:0.5px; }

.tab-bar { display:flex; gap:0; border-bottom:1px solid rgba(255,255,255,0.08); margin-bottom:20px; flex-wrap:wrap; }
.tab-btn { padding:10px 18px; font-size:13px; font-weight:600; color:var(--txt-muted); cursor:pointer; border:none; background:none; border-bottom:2px solid transparent; transition:all 0.2s; }
.tab-btn:hover { color:var(--txt-secondary); }
.tab-btn.active { color:#7c3aed; border-bottom-color:#7c3aed; }

.topic-row { display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:8px; transition:background 0.15s; }
.topic-row:hover { background:rgba(255,255,255,0.03); }
.topic-row input[type="checkbox"] { width:18px; height:18px; accent-color:#7c3aed; cursor:pointer; flex-shrink:0; }
.topic-row.done label { text-decoration:line-through; color:var(--txt-muted); }
.topic-row .hours-badge { font-size:11px; padding:2px 8px; background:rgba(124,58,237,0.15); color:#a78bfa; border-radius:20px; margin-left:auto; white-space:nowrap; font-weight:600; }

.code-block { position:relative; background:#0d1117; border-radius:10px; margin:10px 0; overflow:hidden; font-family:'Courier New',monospace; font-size:13px; line-height:1.6; }
.code-block pre { padding:16px 50px 16px 16px; overflow-x:auto; color:#c9d1d9; white-space:pre; }
.code-block .copy-btn { position:absolute; top:8px; right:8px; background:rgba(255,255,255,0.1); border:none; color:#94a3b8; padding:5px 10px; border-radius:6px; cursor:pointer; font-size:12px; font-weight:600; display:flex; align-items:center; gap:4px; transition:all 0.2s; }
.code-block .copy-btn:hover { background:rgba(255,255,255,0.2); color:#f1f5f9; }

.resource-card { display:block; padding:14px 16px; background:rgba(255,255,255,0.03); border-radius:10px; margin:6px 0; border:1px solid rgba(255,255,255,0.06); transition:all 0.2s; cursor:pointer; text-decoration:none; }
.resource-card:hover { background:rgba(124,58,237,0.08); border-color:rgba(124,58,237,0.3); }
.resource-card .r-title { font-size:14px; font-weight:600; color:var(--txt-primary); }
.resource-card .r-url { font-size:11px; color:var(--txt-muted); margin-top:2px; }

.project-card { padding:16px; background:rgba(255,255,255,0.03); border-radius:12px; margin:8px 0; border-left:3px solid; }
.project-card .p-title { font-size:15px; font-weight:700; color:var(--txt-primary); margin-bottom:6px; }
.project-card .p-desc { font-size:13px; color:var(--txt-secondary); line-height:1.5; }

.phase-header { font-size:14px; font-weight:700; padding:10px 0 4px 0; margin-top:12px; display:flex; align-items:center; gap:8px; }
.phase-header:first-child { margin-top:0; }

.accordion { margin:8px 0; border-radius:12px; overflow:hidden; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); }
.accordion-header { padding:14px 16px; cursor:pointer; display:flex; align-items:center; gap:10px; font-weight:700; font-size:14px; transition:background 0.2s; }
.accordion-header:hover { background:rgba(255,255,255,0.04); }
.accordion-header .acc-arrow { transition:transform 0.3s; font-size:12px; }
.accordion-header.open .acc-arrow { transform:rotate(90deg); }
.accordion-body { max-height:0; overflow:hidden; transition:max-height 0.4s ease; }
.accordion-body.open { max-height:8000px; }
.accordion-body-inner { padding:0 16px 16px 16px; }

.kb-table { width:100%; border-collapse:collapse; font-size:13px; }
.kb-table th { text-align:left; padding:8px 10px; background:rgba(124,58,237,0.1); color:#a78bfa; font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:0.5px; }
.kb-table td { padding:8px 10px; border-bottom:1px solid rgba(255,255,255,0.04); color:var(--txt-secondary); vertical-align:top; line-height:1.5; }

.runbook-card { margin:10px 0; padding:16px; background:rgba(255,255,255,0.03); border-radius:12px; border:1px solid rgba(255,255,255,0.06); }
.runbook-card .rb-title { font-size:15px; font-weight:700; margin-bottom:8px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.runbook-card ol { padding-left:20px; font-size:13px; color:var(--txt-secondary); line-height:1.7; }

.arch-diagram { background:#0d1117; border-radius:10px; padding:16px; font-family:'Courier New',monospace; font-size:12px; line-height:1.5; color:#8b949e; overflow-x:auto; margin:10px 0; white-space:pre; }

.lab-card { margin:10px 0; padding:16px; background:rgba(255,255,255,0.03); border-radius:12px; border:1px solid rgba(255,255,255,0.06); }
.lab-card .lab-title { font-size:15px; font-weight:700; margin-bottom:8px; display:flex; align-items:center; gap:8px; }
.lab-card ol { padding-left:20px; }
.lab-card li { font-size:13px; color:var(--txt-secondary); line-height:1.7; }

.new-badge { font-size:9px; padding:2px 6px; background:linear-gradient(135deg,#7c3aed,#06b6d4); color:#fff; border-radius:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; }

.search-bar { position:relative; margin-bottom:16px; }
.search-bar input { width:100%; padding:10px 14px 10px 38px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08); border-radius:10px; color:var(--txt-primary); font-size:14px; outline:none; transition:border-color 0.2s; }
.search-bar input:focus { border-color:rgba(124,58,237,0.5); }
.search-bar .search-icon { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--txt-muted); }

.confetti-piece { position:fixed; pointer-events:none; z-index:9999; font-size:18px; animation:confetti-fall 2.5s ease-out forwards; }
@keyframes confetti-fall { 0%{opacity:1;transform:translateY(0) rotate(0deg);} 100%{opacity:0;transform:translateY(110vh) rotate(720deg);} }

.severity-badge { font-size:10px; padding:2px 8px; border-radius:8px; font-weight:700; }
.sev-critical { background:rgba(239,68,68,0.15); color:#f87171; }
.sev-high { background:rgba(245,158,11,0.15); color:#fbbf24; }
.sev-medium { background:rgba(234,179,8,0.15); color:#facc15; }

.gradient-text { background:linear-gradient(135deg,#7c3aed,#06b6d4); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }

.sidebar-section-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--txt-muted); padding:12px 14px 4px 14px; opacity:0.6; }

@media (max-width:768px) {
  .sidebar { transform:translateX(-100%); transition:transform 0.3s; width:280px; }
  .sidebar.open { transform:translateX(0); }
  .main-panel { margin-left:0; }
  .stats-bar { grid-template-columns:repeat(2,1fr); }
  .mobile-toggle { display:flex!important; }
}
</style>
</head>

<script>
// ─── DATA ───
const TECHS = [
  // ════════════════════════════════════════════
  // NEW 8 CATEGORIES (before existing ones)
  // ════════════════════════════════════════════
  {
    id:'linux', name:'Linux Administration', emoji:'🐧', color:'#f97316', hours:60, level:'Beginner→Advanced',
    phases:[
      { title:'Phase 1 – Kernel & Boot (Week 1-2, 15hrs)', topics:[
        {id:'lx1',label:'Linux architecture & kernel overview',hrs:3},
        {id:'lx2',label:'systemd boot process & targets',hrs:3},
        {id:'lx3',label:'Process management ps/top/htop/kill',hrs:2},
        {id:'lx4',label:'User & group management',hrs:2},
        {id:'lx5',label:'File permissions & ACLs',hrs:2},
        {id:'lx6',label:'SSH hardening & key-based auth',hrs:2},
        {id:'lx7',label:'Cron & at job scheduling',hrs:1},
      ]},
      { title:'Phase 2 – Storage & Networking (Week 3-4, 20hrs)', topics:[
        {id:'lx8',label:'LVM PV/VG/LV creation & resizing',hrs:4},
        {id:'lx9',label:'Filesystems ext4/xfs/btrfs',hrs:3},
        {id:'lx10',label:'fstab & mount management',hrs:2},
        {id:'lx11',label:'Disk partitioning fdisk/parted/gdisk',hrs:2},
        {id:'lx12',label:'Linux networking ip/ss/netstat/nmcli',hrs:3},
        {id:'lx13',label:'iptables/nftables firewall rules',hrs:3},
        {id:'lx14',label:'NFS/Samba file sharing',hrs:2},
        {id:'lx15',label:'DNS resolution & /etc/hosts',hrs:1},
      ]},
      { title:'Phase 3 – Performance & Logs (Week 5-6, 15hrs)', topics:[
        {id:'lx16',label:'System performance tuning sysctl',hrs:3},
        {id:'lx17',label:'Log management journalctl/logrotate',hrs:2},
        {id:'lx18',label:'/proc & /sys virtual filesystems',hrs:2},
        {id:'lx19',label:'Memory management & OOM killer',hrs:2},
        {id:'lx20',label:'strace/lsof/perf troubleshooting',hrs:3},
        {id:'lx21',label:'Disk I/O monitoring iostat/iotop',hrs:2},
        {id:'lx22',label:'Network performance iperf/tcpdump',hrs:1},
      ]},
      { title:'Phase 4 – Bash & Automation (Week 7, 10hrs)', topics:[
        {id:'lx23',label:'Bash scripting variables loops conditionals',hrs:3},
        {id:'lx24',label:'regex sed/awk/grep',hrs:2},
        {id:'lx25',label:'Error handling set -euo pipefail',hrs:2},
        {id:'lx26',label:'systemd service unit files',hrs:2},
        {id:'lx27',label:'Security hardening & CIS benchmarks',hrs:1},
      ]},
    ],
    commands:`# === PROCESS MANAGEMENT ===
ps aux | grep nginx
top -bn1 | head -20
htop -d 10
kill -9 $(pgrep nginx)
pkill -f "python app.py"
nice -n 10 ./myscript.sh
renice -n -5 -p 1234
strace -p 1234 -e trace=file

# === DISK & LVM ===
lsblk -f
df -hT
du -sh /var/log/*
pvcreate /dev/sdb /dev/sdc
vgcreate datavg /dev/sdb /dev/sdc
lvcreate -L 50G -n datalv datavg
mkfs.xfs /dev/datavg/datalv
lvextend -L +20G /dev/datavg/datalv
xfs_growfs /mnt/data
lvdisplay && vgdisplay

# === NETWORKING ===
ip addr show
ip route show
ss -tlnp
tcpdump -ni eth0 port 80
netstat -rn
ip link set eth0 up

# === LOGS ===
journalctl -u kubelet -n 100 --no-pager
journalctl --since "2h ago" -p err
journalctl -f -u nginx
grep -i "oom" /var/log/kern.log
logrotate -d /etc/logrotate.conf

# === PERFORMANCE ===
vmstat 1 5
iostat -xz 1 3
sar -u 1 5
free -h
sysctl vm.swappiness=10
echo 'vm.swappiness=10' >> /etc/sysctl.conf

# === SSH HARDENING (/etc/ssh/sshd_config) ===
# PermitRootLogin no
# PasswordAuthentication no
# PubkeyAuthentication yes
# AllowUsers brian devops
# Port 2222
ssh-keygen -t ed25519 -C "brian@homelab"
ssh-copy-id -i ~/.ssh/id_ed25519.pub user@host

# === BASH SCRIPT TEMPLATE ===
#!/usr/bin/env bash
set -euo pipefail
IFS=$'\\n\\t'
readonly LOG="/var/log/myapp.log"
log() { echo "[$(date '+%Y-%m-%d %H:%M:%S')] $*" | tee -a "$LOG"; }
log "Script started"`,
    resources:[
      {title:'Linux man pages',url:'https://man7.org/linux/man-pages/'},
      {title:'The Linux Command Line Book',url:'https://linuxcommand.org/tlcl.php'},
      {title:'linuxcommand.org',url:'https://linuxcommand.org'},
      {title:'Red Hat Sysadmin Blog',url:'https://www.redhat.com/sysadmin/'},
      {title:'TechWorld with Nana Linux',url:'https://youtube.com/@TechWorldwithNana'},
    ],
    projects:[
      {title:'Harden 4 K8s Nodes',desc:'Apply CIS benchmark hardening script to all Proxmox VMs, disable root SSH, configure auditd'},
      {title:'LVM Storage Lab',desc:'Create PV/VG/LV, format with XFS, extend online, snapshot and restore'},
      {title:'Bash Health Check Bot',desc:'Script monitors CPU/disk/memory and emails alerts via mailutils or webhook'},
    ]
  },
  {
    id:'aws', name:'AWS Cloud Architecture', emoji:'☁️', color:'#ff9900', hours:55, level:'Intermediate→Advanced',
    phases:[
      { title:'Phase 1 – IAM & Networking (Week 1-2, 15hrs)', topics:[
        {id:'aw1',label:'AWS Organizations & multi-account',hrs:3},
        {id:'aw2',label:'IAM users/roles/policies/SCP',hrs:4},
        {id:'aw3',label:'VPC subnets/IGW/NAT/SG/NACLs',hrs:4},
        {id:'aw4',label:'Route53 DNS & hosted zones',hrs:2},
        {id:'aw5',label:'ALB/NLB load balancers',hrs:2},
      ]},
      { title:'Phase 2 – Compute & Containers (Week 3-4, 20hrs)', topics:[
        {id:'aw6',label:'EC2 AMI/ASG/Launch Templates',hrs:4},
        {id:'aw7',label:'ECS Fargate & EC2 mode',hrs:4},
        {id:'aw8',label:'EKS managed K8s & node groups',hrs:5},
        {id:'aw9',label:'ECR image registry',hrs:2},
        {id:'aw10',label:'Lambda serverless basics',hrs:3},
        {id:'aw11',label:'S3 versioning/lifecycle/replication',hrs:2},
      ]},
      { title:'Phase 3 – Data & Ops (Week 5-6, 20hrs)', topics:[
        {id:'aw12',label:'RDS Multi-AZ & Read Replicas',hrs:3},
        {id:'aw13',label:'ElastiCache Redis/Memcached',hrs:2},
        {id:'aw14',label:'CloudWatch metrics/alarms/logs',hrs:3},
        {id:'aw15',label:'CloudTrail audit logging',hrs:2},
        {id:'aw16',label:'AWS Backup strategies',hrs:2},
        {id:'aw17',label:'Well-Architected Framework',hrs:3},
        {id:'aw18',label:'Cost optimization & Savings Plans',hrs:3},
        {id:'aw19',label:'AWS CLI & boto3 automation',hrs:2},
      ]},
    ],
    commands:`# === IAM ===
aws sts get-caller-identity
aws iam create-role --role-name EKSNodeRole \\
  --assume-role-policy-document file://trust-policy.json
aws iam attach-role-policy --role-name EKSNodeRole \\
  --policy-arn arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
aws sts assume-role --role-arn arn:aws:iam::123456789:role/DevOps \\
  --role-session-name devops-session

# === VPC ===
aws ec2 describe-vpcs --filters "Name=isDefault,Values=false"
aws ec2 describe-subnets --filters "Name=vpc-id,Values=vpc-xxx"
aws ec2 authorize-security-group-ingress --group-id sg-xxx \\
  --protocol tcp --port 443 --cidr 0.0.0.0/0

# === EKS ===
aws eks update-kubeconfig --name prod-cluster --region us-east-1
eksctl create cluster --name prod-cluster --region us-east-1 \\
  --nodegroup-name workers --node-type t3.medium --nodes 3 \\
  --nodes-min 2 --nodes-max 5 --managed
eksctl get cluster --region us-east-1
aws eks describe-cluster --name prod-cluster
aws eks list-nodegroups --cluster-name prod-cluster

# === ECR ===
aws ecr create-repository --repository-name myapp --region us-east-1
aws ecr get-login-password --region us-east-1 | \\
  docker login --username AWS --password-stdin \\
  123456789.dkr.ecr.us-east-1.amazonaws.com
docker tag myapp:1.0 123456789.dkr.ecr.us-east-1.amazonaws.com/myapp:1.0
docker push 123456789.dkr.ecr.us-east-1.amazonaws.com/myapp:1.0

# === S3 ===
aws s3 mb s3://brian-devops-state-2026
aws s3 cp ./backup.tar.gz s3://brian-devops-state-2026/backups/
aws s3 sync ./configs s3://brian-devops-state-2026/configs/
aws s3 ls s3://brian-devops-state-2026 --recursive --human-readable

# === CLOUDWATCH ===
aws cloudwatch put-metric-alarm --alarm-name high-cpu \\
  --metric-name CPUUtilization --namespace AWS/EC2 \\

name: CI/CD Pipeline
on:
  push:

  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: \${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: \${{ matrix.python-version }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: \${{ runner.os }}-pip-\${{ hashFiles('requirements.txt') }}
      - run: pip install -r requirements.txt
      - run: pytest --cov=. --cov-report=xml -v
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-\${{ matrix.python-version }}
          path: coverage.xml

  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: \${{ github.actor }}
          password: \${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          push: \${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/\${{ github.repository }}:\${{ github.sha }}

  scan:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: aquasecurity/trivy-action@master

          image-ref: ghcr.io/\${{ github.repository }}:\${{ github.sha }}

    environment: production

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/myapp \\

    commands:`# .gitlab-ci.yml
stages: [test, build, scan, deploy-staging, deploy-prod]

variables:
  DOCKER_REGISTRY: $CI_REGISTRY
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths: [.pip-cache/]

test:
  stage: test
  image: python:3.11
  script:
    - pip install --cache-dir .pip-cache -r requirements.txt
    - pytest --cov=. --cov-report=xml -v
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week

build:
  stage: build
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $IMAGE_TAG .
    - docker push $IMAGE_TAG
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

scan:
  stage: scan
  image: aquasec/trivy:latest
  script:
    - trivy image --exit-code 1 --severity HIGH,CRITICAL $IMAGE_TAG

deploy-staging:
  stage: deploy-staging
  environment:
    name: staging
    url: https://staging.myapp.com
  script:
    - kubectl set image deployment/myapp myapp=$IMAGE_TAG -n staging
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy-prod:
  stage: deploy-prod
  environment:
    name: production
    url: https://myapp.com
  script:
    - helm upgrade myapp ./charts/myapp \\
        --set image.tag=$CI_COMMIT_SHA \\
        -n production --install
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# DAG — run test and build in parallel
build-dag:
  stage: build
  needs: []`,

// ─── SIDEBAR ───
function renderSidebar() {
  const nav = document.getElementById('sidebar-nav');
  nav.innerHTML = '';

  // Group items into sections
  const newItems = ['linux','aws','terraform','ansible','gitops','monitoring','platform','windows'];
  const coreItems = ['python','fastapi','kafka','docker','kubernetes','helm','ghactions','gitlab'];

  // New categories section
  const newLabel = document.createElement('div');
  newLabel.className = 'sidebar-section-label';
  newLabel.textContent = 'Infrastructure & Cloud';
  nav.appendChild(newLabel);

  SIDEBAR_ITEMS.forEach(item => {
    if (!newItems.includes(item.id)) return;
    appendSidebarItem(nav, item);
  });

  // Core categories section
  const coreLabel = document.createElement('div');
  coreLabel.className = 'sidebar-section-label';
  coreLabel.textContent = 'Languages & Tools';
  nav.appendChild(coreLabel);

  SIDEBAR_ITEMS.forEach(item => {
    if (!coreItems.includes(item.id)) return;
    appendSidebarItem(nav, item);
  });

  // Knowledge Base
  const kbLabel = document.createElement('div');
  kbLabel.className = 'sidebar-section-label';
  kbLabel.textContent = 'Reference';
  nav.appendChild(kbLabel);

  SIDEBAR_ITEMS.forEach(item => {
    if (!item.isKB) return;
    appendSidebarItem(nav, item);
  });

  nav.querySelectorAll('.sidebar-item').forEach(el => {
    el.addEventListener('click', () => {
      activeItem = el.dataset.id;
      if (activeItem !== 'kb') activeTechTab = 'topics';
      render();
      document.getElementById('sidebar').classList.remove('open');
    });
  });
}

function appendSidebarItem(nav, item) {
  const pct = item.isKB ? null : getTechPct(item.id);
  const div = document.createElement('div');
  div.className = 'sidebar-item' + (activeItem === item.id ? ' active' : '');
  div.dataset.id = item.id;
  div.innerHTML = `
    <div class="icon-bubble" style="background:${item.color}22;">${item.emoji}</div>
    <div class="item-info">
      <div class="item-name">${item.name}${item.isKB ? ' <span class="new-badge">NEW</span>' : ''}</div>
      ${pct !== null ? `<div class="mini-bar"><div class="mini-bar-fill" style="width:${pct}%;background:${item.color};"></div></div>` : ''}
    </div>
    ${pct !== null ? `<div class="pct">${pct}%</div>` : ''}
  `;
  nav.appendChild(div);
}

function getTechPct(techId) {
  const tech = TECHS.find(t => t.id === techId);
  if (!tech) return 0;
  const all = tech.phases.flatMap(p => p.topics);
  if (all.length === 0) return 0;
  const done = all.filter(t => checkedTopics[t.id]).length;
  return Math.round((done / all.length) * 100);
}

function getTechHoursDone(techId) {
  const tech = TECHS.find(t => t.id === techId);
  if (!tech) return 0;
  return tech.phases.flatMap(p => p.topics).filter(t => checkedTopics[t.id]).reduce((s, t) => s + t.hrs, 0);
}

// ─── STATS ───
function updateStats() {
  const allTopics = TECHS.flatMap(t => t.phases.flatMap(p => p.topics));
  const totalTopics = allTopics.length;
  const doneTopics = allTopics.filter(t => checkedTopics[t.id]).length;
  const totalHours = TECHS.reduce((s, t) => s + t.hours, 0);
  const doneHours = allTopics.filter(t => checkedTopics[t.id]).reduce((s, t) => s + t.hrs, 0);
  const pct = totalTopics > 0 ? Math.round((doneTopics / totalTopics) * 100) : 0;
  const mastered = TECHS.filter(t => getTechPct(t.id) === 100).length;

  document.getElementById('stat-topics').textContent = `${doneTopics} / ${totalTopics}`;
  document.getElementById('stat-hours').textContent = `${doneHours} / ${totalHours}`;
  document.getElementById('stat-pct').textContent = `${pct}%`;
  document.getElementById('stat-mastered').textContent = mastered;
}

// ─── CONFETTI ───
function fireConfetti() {
  const emojis = ['🎉','🎊','⭐','🏆','✨','🔥','💪','🚀'];
  for (let i = 0; i < 40; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.top = '-20px';
    el.style.animationDelay = (Math.random() * 0.8) + 's';
    el.style.animationDuration = (1.8 + Math.random() * 1.5) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3500);
  }
}

// ─── COPY ───
function setupCopyButtons() {
  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      const code = this.closest('.code-block').querySelector('pre').textContent;
      navigator.clipboard.writeText(code).then(() => {
        this.textContent = '✅ Copied!';
        setTimeout(() => { this.textContent = '📋 Copy'; }, 2000);
      });
    });
  });
}

// ─── TECH VIEW ───
function renderTechView(tech) {
  const pct = getTechPct(tech.id);
  const hrsDone = getTechHoursDone(tech.id);
  let html = `
    <div style="margin-bottom:20px;">
      <div class="flex items-center gap-3 flex-wrap">
        <span style="font-size:32px;">${tech.emoji}</span>
        <div>
          <h2 class="text-xl md:text-2xl font-extrabold text-txt-100">${tech.name}</h2>
          <div class="text-sm text-txt-400">${tech.level} · ${tech.hours}hrs total · ${hrsDone}hrs done</div>
        </div>
        <div class="ml-auto text-right">
          <div class="text-2xl font-extrabold" style="color:${tech.color};">${pct}%</div>
          <div class="text-xs text-txt-500">complete</div>
        </div>
      </div>
      <div class="mt-3 h-2 rounded-full" style="background:rgba(255,255,255,0.06);">
        <div class="h-2 rounded-full transition-all duration-500" style="width:${pct}%;background:${tech.color};"></div>
      </div>
    </div>
    <div class="tab-bar">
      <button class="tab-btn tech-tab-btn ${activeTechTab==='topics'?'active':''}" data-tab="topics">Topics</button>
      <button class="tab-btn tech-tab-btn ${activeTechTab==='commands'?'active':''}" data-tab="commands">Commands</button>
      <button class="tab-btn tech-tab-btn ${activeTechTab==='resources'?'active':''}" data-tab="resources">Resources</button>
      <button class="tab-btn tech-tab-btn ${activeTechTab==='projects'?'active':''}" data-tab="projects">Projects</button>
    </div>
  `;

  if (activeTechTab === 'topics') {
    tech.phases.forEach(phase => {
      html += `<div class="phase-header" style="color:${tech.color};">▸ ${phase.title}</div>`;
      phase.topics.forEach(topic => {
        const checked = checkedTopics[topic.id] ? 'checked' : '';
        const done = checkedTopics[topic.id] ? 'done' : '';
        html += `<div class="topic-row ${done}">
          <input type="checkbox" id="chk-${topic.id}" data-topic="${topic.id}" ${checked} />
          <label for="chk-${topic.id}" style="cursor:pointer;font-size:14px;color:var(--txt-secondary);">${topic.label}</label>
          <span class="hours-badge">${topic.hrs}h</span>
        </div>`;
      });
    });
  } else if (activeTechTab === 'commands') {
    html += `<div class="code-block" style="border-left:4px solid ${tech.color};">
      <button class="copy-btn">📋 Copy</button>
      <pre>${escapeHtml(tech.commands)}</pre>
    </div>`;
  } else if (activeTechTab === 'resources') {
    tech.resources.forEach(r => {
      html += `<a class="resource-card" href="${r.url}" target="_blank" rel="noopener">
        <div class="r-title">${r.title}</div>
        <div class="r-url">${r.url}</div>
      </a>`;
    });
  } else if (activeTechTab === 'projects') {
    tech.projects.forEach((p,i) => {
      html += `<div class="project-card" style="border-left-color:${tech.color};">
        <div class="p-title">${i+1}. ${p.title}</div>
        <div class="p-desc">${p.desc}</div>
      </div>`;
    });
  }
  return html;
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ─── KNOWLEDGE BASE VIEW ───
function renderKBView() {
  let html = `
    <div style="margin-bottom:20px;">
      <h2 class="text-xl md:text-2xl font-extrabold text-txt-100">📚 Senior Engineering Knowledge Base</h2>
      <p class="text-sm text-txt-400 mt-1">16 K8s chapters, Brian's personal notes, runbooks, architecture & labs — all embedded</p>
    </div>
    <div class="search-bar">
      <span class="search-icon"><i data-lucide="search" class="w-4 h-4"></i></span>
      <input type="text" id="kb-search" placeholder="Search knowledge base..." />
    </div>
    <div class="tab-bar">
      <button class="tab-btn kb-tab-btn ${activeKBTab==='chapters'?'active':''}" data-kbtab="chapters">All Chapters</button>
      <button class="tab-btn kb-tab-btn ${activeKBTab==='notes'?'active':''}" data-kbtab="notes">Brian's Notes</button>
      <button class="tab-btn kb-tab-btn ${activeKBTab==='runbooks'?'active':''}" data-kbtab="runbooks">Runbooks</button>
      <button class="tab-btn kb-tab-btn ${activeKBTab==='architecture'?'active':''}" data-kbtab="architecture">Architecture</button>
      <button class="tab-btn kb-tab-btn ${activeKBTab==='labs'?'active':''}" data-kbtab="labs">Labs</button>
    </div>
    <div id="kb-content"></div>
  `;
  return html;
}

function renderKBContent(filter) {
  const container = document.getElementById('kb-content');
  if (!container) return;
  let html = '';
  const q = (filter || '').toLowerCase();

  if (activeKBTab === 'chapters') {
    KB_CHAPTERS.forEach((ch, idx) => {
      if (q && !ch.title.toLowerCase().includes(q) && !ch.rows.some(r => r[0].toLowerCase().includes(q) || r[1].toLowerCase().includes(q)) && !(ch.note||'').toLowerCase().includes(q)) return;
      html += `<div class="accordion" data-acc="${idx}">
        <div class="accordion-header" data-acc-toggle="${idx}">
          <span class="acc-arrow">▶</span>
          <span style="color:${ch.color};">${ch.badge}</span>
          <span>Ch${ch.num} – ${ch.title}</span>
        </div>
        <div class="accordion-body" data-acc-body="${idx}">
          <div class="accordion-body-inner">
            <div class="overflow-x-auto">
              <table class="kb-table">
                <thead><tr><th style="width:180px;">Component</th><th>Details</th></tr></thead>
                <tbody>${ch.rows.map(r => `<tr><td style="color:${ch.color};font-weight:600;">${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</tbody>
              </table>
            </div>
            ${ch.note ? `<div class="mt-3 p-3 rounded-lg text-xs text-txt-300" style="background:rgba(124,58,237,0.08);border-left:3px solid ${ch.color};">📝 <b>Key Insight:</b> ${ch.note}</div>` : ''}
            ${ch.extraCode ? `<div class="code-block mt-3" style="border-left:4px solid ${ch.color};"><button class="copy-btn">📋 Copy</button><pre>${escapeHtml(ch.extraCode)}</pre></div>` : ''}
          </div>
        </div>
      </div>`;
    });
  } else if (activeKBTab === 'notes') {
    KB_BRIANS_NOTES.forEach((note, idx) => {
      if (q && !note.title.toLowerCase().includes(q) && !note.content.toLowerCase().includes(q)) return;
      html += `<div class="accordion" data-acc="n${idx}">
        <div class="accordion-header" data-acc-toggle="n${idx}">
          <span class="acc-arrow">▶</span>
          <span style="color:#f59e0b;">📝</span>
          <span>${note.title}</span>
        </div>
        <div class="accordion-body" data-acc-body="n${idx}">
          <div class="accordion-body-inner">
            <div class="text-sm text-txt-300" style="line-height:1.8;white-space:pre-wrap;">${note.content}</div>
          </div>
        </div>
      </div>`;
    });
  } else if (activeKBTab === 'runbooks') {
    KB_RUNBOOKS.forEach(rb => {
      if (q && !rb.title.toLowerCase().includes(q) && !rb.steps.some(s => s.toLowerCase().includes(q))) return;
      const sevClass = rb.severity === 'critical' ? 'sev-critical' : rb.severity === 'high' ? 'sev-high' : 'sev-medium';
      html += `<div class="runbook-card">
        <div class="rb-title">${rb.emoji} ${rb.title} <span class="severity-badge ${sevClass}">${rb.severity.toUpperCase()}</span></div>
        <ol>${rb.steps.map(s => `<li>${s}</li>`).join('')}</ol>
      </div>`;
    });
  } else if (activeKBTab === 'architecture') {
    KB_ARCHITECTURE.forEach(arch => {
      if (q && !arch.title.toLowerCase().includes(q) && !arch.diagram.toLowerCase().includes(q)) return;
      html += `<div style="margin:16px 0;">
        <h3 class="text-base font-bold text-txt-100 mb-2" style="color:#a78bfa;">${arch.title}</h3>
        <div class="arch-diagram">${escapeHtml(arch.diagram)}</div>
      </div>`;
    });
  } else if (activeKBTab === 'labs') {
    KB_LABS.forEach((lab, i) => {
      if (q && !lab.title.toLowerCase().includes(q) && !lab.steps.some(s => s.toLowerCase().includes(q))) return;
      html += `<div class="lab-card">
        <div class="lab-title"><span style="color:#06b6d4;">🔬</span> ${lab.title}</div>
        <ol>${lab.steps.map(s => `<li>${s}</li>`).join('')}</ol>
      </div>`;
    });
  }
  container.innerHTML = html || '<div class="text-center text-txt-500 py-10">No results found.</div>';

  container.querySelectorAll('.accordion-header').forEach(hdr => {
    hdr.addEventListener('click', function() {
      const key = this.dataset.accToggle;
      const body = container.querySelector(`[data-acc-body="${key}"]`);
      body.classList.toggle('open');
      this.classList.toggle('open');
    });
  });

  setupCopyButtons();
  if (typeof lucide !== "undefined" && typeof lucide.createIcons === "function") {
    lucide.createIcons();
  }
}

// ─── MAIN RENDER ───
function render() {
  renderSidebar();
  updateStats();
  const content = document.getElementById('content-area');

  if (activeItem === 'kb') {
    content.innerHTML = renderKBView();
    content.querySelectorAll('.kb-tab-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        activeKBTab = this.dataset.kbtab;
        content.querySelectorAll('.kb-tab-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        renderKBContent(document.getElementById('kb-search')?.value || '');
      });
    });
    const searchInput = document.getElementById('kb-search');
    if (searchInput) {
      searchInput.addEventListener('input', function() {
        renderKBContent(this.value);
      });
    }
    renderKBContent('');
  } else {
    const tech = TECHS.find(t => t.id === activeItem);
    if (tech) {
      content.innerHTML = renderTechView(tech);
      content.querySelectorAll('.tech-tab-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          activeTechTab = this.dataset.tab;
          content.querySelectorAll('.tech-tab-btn').forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          const tech2 = TECHS.find(t => t.id === activeItem);
          content.innerHTML = renderTechView(tech2);
          attachTechEventListeners();
        });
      });
      attachTechEventListeners();
    }
  }
  if (typeof lucide !== "undefined" && typeof lucide.createIcons === "function") {
    lucide.createIcons();
  }
}

function attachTechEventListeners() {
  document.querySelectorAll('.topic-row input[type="checkbox"]').forEach(chk => {
    chk.addEventListener('change', function() {
      const topicId = this.dataset.topic;
      checkedTopics[topicId] = this.checked;
      save();
      const row = this.closest('.topic-row');
      if (this.checked) row.classList.add('done');
      else row.classList.remove('done');
      updateStats();
      renderSidebar();

      const tech = TECHS.find(t => t.id === activeItem);
      if (tech) {
        const pct = getTechPct(tech.id);
        if (pct === 100 && !celebratedTechs[tech.id]) {
          celebratedTechs[tech.id] = true;
          save();
          fireConfetti();
        }
      }
    });
  });
  document.querySelectorAll('.tech-tab-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      activeTechTab = this.dataset.tab;
      render();
    });
  });
  setupCopyButtons();
}

// ─── MOBILE MENU ───
function setupMobile() {
  const toggleBtn = document.getElementById('mobile-toggle-btn');
  const sidebar = document.getElementById('sidebar');
  if (window.innerWidth <= 768) {
    toggleBtn.style.display = 'flex';
  }
  toggleBtn.addEventListener('click', function() {
    sidebar.classList.toggle('open');
  });
  window.addEventListener('resize', function() {
    if (window.innerWidth <= 768) {
      toggleBtn.style.display = 'flex';
    } else {
      toggleBtn.style.display = 'none';
      sidebar.classList.remove('open');
    }
  });
}

// ─── INIT ───
if (typeof lucide !== "undefined" && typeof lucide.createIcons === "function") {
  lucide.createIcons();
}
setupMobile();
render();
</script>
</body>
</html>
